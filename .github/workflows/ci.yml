name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Unit Tests
            command: pnpm --filter @usefractal/frac test:unit && pnpm --filter @usefractal/create-frac test:unit && pnpm --filter usefractal test:unit
          - name: Lint & Format
            command: pnpm --filter @usefractal/frac test:format && pnpm --filter @usefractal/create-frac test:format && pnpm --filter usefractal test:format
          - name: Build
            command: pnpm --filter @usefractal/frac build && pnpm --filter @usefractal/create-frac build && pnpm --filter usefractal build
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}

  create-frac-template:
    name: create-frac template
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frac
        run: pnpm --filter @usefractal/frac build

      - name: Build templates
        run: pnpm --filter frac-blank run build

  draft-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: release-drafter/release-drafter@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
